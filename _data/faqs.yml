- id: using-library-2
  category: "Using the Library"
  question: "What is the default rounding mode, and can I change it?"
  answer: >-
    The default is round-half-to-even (ties-to-even), the IEEE 754 default.
    Other IEEE rounding modes are available and are selected through the
    rounding / context API. (Editor: name the exact wrapper entry points
    and list the supported modes; see WrapperLayer.md.)

- id: using-library-3
  category: "Using the Library"
  question: "Is a decimal128 value thread-safe? Are decimal128 operations thread-safe?"
  answer: >-
    Yes, both. A decimal128 value is a small immutable 16-byte value, so it
    is safe to share and copy across threads freely. The operations are
    thread-safe too: each one reads its immutable inputs and returns a new
    value without mutating anything shared, so concurrent operations on
    different threads cannot interfere. The library never shares a context
    object of its own; a context exists only if you construct one, and
    sharing that across threads is your responsibility, not the library's.
    See ConcurrencyModel.md for the full story on contexts and flags.

- id: finance-1
  category: "Finance Layer"
  question: "What does the finance layer provide?"
  answer: >-
    BasicFinance is a small library of everyday financial calculations —
    interest, annuities, mortgage amortization, and the discounted-cash-flow
    trio NPV / IRR / MIRR — composed entirely from the existing decimal128
    operations so the money math stays exact. A Finance wrapper is exposed
    in every port except bare C. See Finance.md.

- id: finance-2
  category: "Finance Layer"
  question: "Why does the finance layer live in Core rather than the wrapper?"
  answer: >-
    For cross-platform consistency. If each wrapper re-implemented, say,
    irr in its host language, the iterative solvers could diverge in
    iteration order or intermediate rounding. Placing the algorithms in
    Core, over the byte-identical operations, means every platform runs the
    one same computation and produces the one same bit pattern. See
    Finance.md.

