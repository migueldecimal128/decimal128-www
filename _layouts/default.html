<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="container">
      <a class="site-title" href="index.html">Decimal128 by Miguel</a>
      <nav class="main-nav" aria-label="Primary">
        <ul>
          <li><a href="index.html"{% if page.url == "/index.html" %} aria-current="page"{% endif %}>Home</a></li>
          <li><a href="business-case.html"{% if page.url == "/business-case.html" %} aria-current="page"{% endif %}>Business Case</a></li>
          <li><a href="benchmarks.html"{% if page.url == "/benchmarks.html" %} aria-current="page"{% endif %}>Benchmarks</a></li>
          <li><a href="qa.html"{% if page.url == "/qa.html" %} aria-current="page"{% endif %}>Q&amp;A</a></li>
          <li><a href="https://github.com/abigail-128" target="_blank" rel="noopener">GitHub ↗</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>{{ page.heading }}</h1>
      <p>{{ site.tagline }}</p>
    </div>
  </section>

  <main id="main-content">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; 2026 Decimal128. Content is provided for information only.</span>
      <span><a href="https://github.com/abigail-128" target="_blank" rel="noopener">View our GitHub organisation</a></span>
    </div>
  </footer>

  {% for script in page.extra_js %}
  <script src="{{ script }}"></script>
  {% endfor %}
</body>
</html>
